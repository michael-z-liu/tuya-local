name: Window opener
products:
  - id: 4w6o5buyvgps5vqk
    model: yypy-24pk
entities:
  - entity: cover
    class: window
    dps:
      - id: 2
        type: string
        name: control
        mapping:
          - dps_val: open
            value: open
          - dps_val: stop
            value: stop
          - dps_val: close
            value: close
          - dps_val: continue
            # HA does not support this
            hidden: true
      - id: 7
        type: integer
        name: position
        range:
          min: 0
          max: 100
      - id: 7
        type: integer
        name: current_position
        range:
          min: 0
          max: 100
  - entity: switch
    name: Wind and rain sensor
    category: config
    dps:
      - id: 24
        type: boolean
        name: switch
        optional: true
  - entity: binary_sensor
    name: Rain
    class: moisture
    dps:
      - id: 103
        type: string
        name: sensor
        optional: true
        mapping:
          - dps_val: "on"
            value: true
          - dps_val: "off"
            value: false
